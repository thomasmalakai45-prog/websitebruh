<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StripesVR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0406;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Avatar Container */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 25px;
        }

        /* Red Outer Glow Ring */
        .avatar-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 3px solid #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.7);
        }

        /* Avatar Placeholder Image */
        .avatar-img {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 98px;
            height: 98px;
            background-color: #2a1115;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Title with Red Cursor Hook */
        .title-container {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .cursor {
            color: #ff1a1a;
            font-size: 2rem;
            font-weight: 300;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Card Container Grid */
        .card-list {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Blank Button Cards */
        .card {
            background-color: #161920;
            border-radius: 8px;
            height: 80px;
            width: 100%;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-2px);
            background-color: #1e222b;
        }
    </style>
</head>
<body>

    <!-- Profile Picture Section -->
    <div class="avatar-container">
        <div class="avatar-glow"></div>
        <div class="avatar-img">
            <!-- Add your avatar image URL inside src when ready -->
            <img src="" alt="" style="width:100%; height:100%; object-fit:cover;">
        </div>
    </div>

    <!-- Title Section -->
    <div class="title-container">
        <h1 class="title">StripesVR</h1>
        <span class="cursor">|</span>
    </div>

    <!-- Blank Buttons Container -->
    <div class="card-list">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>

</body>
</html>
